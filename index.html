
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Stat Line Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home" class="screen">
        <div id="text_area1" class="textArea">
            Can you guess these NBA '24-'25 stat lines?
        </div>
        <button id="startButton">Start</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="question1" class="screen" style="display: none;">

        <div id="text_area2" class="textArea">
            Whose stat line is this?
        </div>

        <!-- STATISTICS GRID: 4 COLUMNS x 2 ROWS -->
        <div id="statGrid">

            <div id="MPtext" class="statArea">MP</div>
            <div id="PTStext" class="statArea">PTS</div>
            <div id="TRBtext" class="statArea">TRB</div>
            <div id="ASTtext" class="statArea">AST</div>

            <div id="BLKtext" class="statArea">BLK</div>
            <div id="STLtext" class="statArea">STL</div>
            <div id="FGtext" class="statArea">FG%</div>

            <div id="threePtext" class="statArea">
                3P%
                <span id="threePvalue"></span>
            </div>

        </div>

        <!-- ANSWER BUTTONS -->
        <button id="player1">Button</button>
        <button id="player2">Button</button>
        <button id="player3">Button</button>
        <button id="player4">Button</button>

        <!-- LEGEND -->
        <div id="legend">

            <div id="legendTitle">Key:</div>

            <div id="key1" class="legendColumn">
                MP: Minutes Played<br>
                PTS: Points<br>
                TRB: Total Rebounds<br>
                AST: Assists
            </div>

            <div id="key2" class="legendColumn">
                BLK: Blocks<br>
                STL: Steals<br>
                FG%: Field Goal %<br>
                3P%: 3-Point %
            </div>

        </div>

        <!-- FEEDBACK -->
        <div id="tryagain1" class="textArea" style="display: none;">
            Try Again!
        </div>

        <div id="nicework1" class="textArea" style="display: none;">
            Nice Work!
        </div>

        <button id="next1" style="display: none;">
            Next Question
        </button>

    </div>

    <!-- END SCREEN -->
    <div id="end" class="screen" style="display: none;">

        <div id="text_area3" class="textArea">
            Good Job!
        </div>

        <img id="image1"
             src="assets/giannis-thumbs-up.jpg"
             alt="Giannis Thumbs Up">

    </div>

    <script src="app.js"></script>

</body>
</html>
