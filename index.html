<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Stat Line Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home" class="screen">
        <div id="text_area1" class="textArea">Can you guess these NBA '24-'25 stat lines?</div>
        <button id="startButton">Start</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="question1" class="screen" style="display: none;">
        <div id="text_area2" class="textArea">Whose stat line is this?</div>
        
        <!-- Answer Buttons -->
        <button id="player1">Button</button>
        <button id="player2">Button</button>
        <button id="player3">Button</button>
        <button id="player4">Button</button>

        <!-- Stat Display Grid (Fixed 3P ID to threeptext) -->
        <div id="MPtext" class="textArea">MP</div>
        <div id="PTStext" class="textArea">PTS</div>
        <div id="TRBtext" class="textArea">TRB</div>
        <div id="ASTtext" class="textArea">AST</div>
        <div id="BLKtext" class="textArea">BLK</div>
        <div id="STLtext" class="textArea">STL</div>
        <div id="FGtext" class="textArea">FG%</div>
        <div id="threeptext" class="textArea">3P%</div>

        <!-- Centered Unified Key -->
        <div id="key-title" class="textArea"><b>Key:</b></div>
        <div id="key1" class="textArea">MP: Minutes Played<br>PTS: Points<br>TRB: Total Rebounds<br>AST: Assists</div>
        <div id="key2" class="textArea">BLK: Blocks<br>STL: Steals<br>FG%: Field Goal %<br>3P%: 3-Point %</div>

        <!-- Feedback & Next Button -->
        <div id="tryagain1" class="textArea" style="display: none;">Try Again!</div>
        <div id="nicework1" class="textArea" style="display: none;">Nice Work!</div>
        <button id="next1" style="display: none;">Next Question</button>
    </div>

    <!-- END SCREEN -->
    <div id="end" class="screen" style="display: none;">
        <div id="text_area3" class="textArea">Good Job!</div>
        <img id="image1" src="giannis-thumbs-up.jpg" alt="Giannis Thumbs Up">
    </div>

    <script src="app.js"></script>
</body>
</html>
